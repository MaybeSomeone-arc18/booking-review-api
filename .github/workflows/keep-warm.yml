name: keep-warm

# Render's free tier spins the service down after 15 idle minutes. Ping the
# health endpoint every 10 minutes so a reviewer never hits a cold start.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -fsS https://booking-review-api-sp7f.onrender.com/health
            sleep 200
          done
