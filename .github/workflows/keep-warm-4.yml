name: keep-warm-4

# Staggered best-effort pings for the free-tier demo. Render availability is
# independent of code quality; transient outages must not turn CI red.
on:
  schedule:
    - cron: "6-59/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Keep demo awake (best effort)
        shell: bash
        run: |
          for i in 1 2 3; do
            if curl -fsS --retry 2 --retry-all-errors --retry-delay 10 --connect-timeout 10 --max-time 30 https://booking-review-api-sp7f.onrender.com/health; then
              echo "Health ping $i succeeded"
            else
              echo "::warning::Health ping $i failed after retries; Render availability is independent of CI"
            fi
            if [ "$i" -lt 3 ]; then sleep 200; fi
          done
