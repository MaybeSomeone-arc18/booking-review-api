name: keep-warm-4

# Independent schedule from keep-warm.yml: GitHub delays cron runs on public
# repos, so several copies keep the union of pings under Render's 15-min idle
# sleep window. Each run pings three times a few minutes apart.

on:
  schedule:
    - cron: "6-59/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -fsS --retry 6 --retry-all-errors --retry-delay 15 -m 180 https://booking-review-api-sp7f.onrender.com/health
            sleep 200
          done
